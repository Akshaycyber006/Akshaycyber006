<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="ak-hero-t ak-hero-d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="ak-hero-t">Akshay Krishna S</title>
  <desc id="ak-hero-d">Cybersecurity Enthusiast, B.Tech IT. Dreaming big, executing silently.</desc>
  <defs>
    <linearGradient id="ak-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="ak-drift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#701A3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ak-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="ak-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ak-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ak-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="ak-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="ak-gridmask"><rect width="1200" height="400" fill="url(#ak-fade)"/></mask>
    <filter id="ak-blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#ak-bg)"/>
  <rect width="1200" height="400" fill="url(#ak-drift)"/>
  <rect width="1200" height="400" fill="url(#ak-grid)" mask="url(#ak-gridmask)"/>
  <circle cx="990" cy="190" r="230" fill="url(#ak-glow)"/>

  <!-- restrained orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" transform="translate(990 190)">
    <circle r="120"/>
    <ellipse rx="170" ry="60" transform="rotate(-22)"/>
    <g>
      <ellipse rx="170" ry="60" transform="rotate(24)" stroke-opacity="0.2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </g>
    <circle r="4" cx="120" cy="0" fill="#E5B5C7" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- animated path: final state is fully drawn, so a static render is complete -->
  <path d="M60 372 C 260 340, 340 392, 560 364 S 860 330, 1140 368" fill="none" stroke="#C77B9B" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="3.5s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </path>

  <text x="70" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="7" fill="#C77B9B">SOFTWARE · AI · CYBERSECURITY</text>
  <text x="68" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#ak-name)">AKSHAY KRISHNA S</text>
  <text x="70" y="238" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="2" fill="#E5B5C7">Cybersecurity Enthusiast  |  B.Tech IT</text>

  <!-- glowing underline -->
  <rect x="70" y="258" width="560" height="4" rx="2" fill="url(#ak-line)" filter="url(#ak-blur)" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="70" y="258" width="560" height="2" rx="1" fill="url(#ak-line)"/>

  <text x="70" y="306" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#C77B9B">Dreaming big, executing silently.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
